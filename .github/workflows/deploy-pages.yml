name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm prettier

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  rue-examples:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the Rue version
        id: rue
        run: echo "version=$(cat .rue-version)" >> "$GITHUB_OUTPUT"

      # Building rue-cli from source takes a few minutes, so the binary is cached per version
      - name: Cache the Rue CLI
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/rue
          key: rue-cli-${{ runner.os }}-${{ steps.rue.outputs.version }}

      - name: Install the Rue CLI
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install rue-cli --version "${{ steps.rue.outputs.version }}" --locked

      - name: Check Rue examples
        run: python3 scripts/check-rue-examples.py

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
